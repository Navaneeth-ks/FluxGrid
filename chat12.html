<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ESP32 Pod Chat</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f2f5fa;
      height: 100vh;
      display: flex;
    }

    /* Sidebar */
    #sidebar {
      width: 220px;
      background: #0077cc;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }
    #sidebar h2 {
      text-align: center;
      margin: 0 0 20px 0;
      font-size: 20px;
    }
    #downloadBtn {
      margin-bottom: 15px;
      padding: 8px 12px;
      background: #005fa3;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    #downloadBtn:hover {
      background: #004080;
    }
    #nodeList {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #nodeList div {
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      text-align: center;
    }
    #nodeList div.active {
      background: white;
      color: #0077cc;
      font-weight: bold;
    }
    #nodeList div:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Main chat area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Chat bubbles */
    .msg {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      word-wrap: break-word;
    }
    .incoming {
      background: #e6f2ff;  /* light blue */
      align-self: flex-start;
      color: #003366;
    }
    .outgoing {
      background: #d4f7d4;  /* light green */
      align-self: flex-end;
      color: #004d00;
      font-weight: bold;
    }
    .meta {
      display: block;
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
    }

    /* Send box */
    #sendBox {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ccc;
    }
    #msg {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 10px;
    }
    .send-btn {
      padding: 10px 18px;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .send-btn:hover {
      background: #005fa3;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar">
    <h2>Pods</h2>
    <button id="downloadBtn">💾 Download Logs</button>
    <div id="nodeList"></div>
  </div>

  <!-- Main content -->
  <div id="main">
    <h3 id="currentNode">Select a node</h3>
    <div id="chat"><div class="empty">No messages yet</div></div>

    <div id="sendBox" style="display:none;">
      <input type="text" id="msg" placeholder="Type your message">
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const baseURL = "http://192.168.4.1"; // ESP32 Master IP
    let messages = [];
    let selectedNode = null;

    // Fetch messages from ESP32
    async function fetchMessages() {
      try {
        const res = await fetch(baseURL + "/messages", {cache: "no-store"});
        if (!res.ok) return;
        const msgs = await res.json();

        msgs.forEach(m => {
          if (!messages.find(x => x.msgID === m.msgID)) {
            m.receivedAt = new Date().toLocaleString();
            messages.push(m);
          }
        });

        updateNodeList();
        renderChat();
      } catch (e) {
        console.error("Fetch error", e);
      }
    }

    // Update sidebar with unique nodes
    function updateNodeList() {
      const nodeList = document.getElementById("nodeList");
      const uniqueNodes = [...new Set(messages.map(m => m.sender).concat(messages.map(m => m.target || [])))];
      nodeList.innerHTML = "";

      uniqueNodes.forEach(node => {
        if (!node || node === "Me") return; // hide "Me"
        const div = document.createElement("div");
        div.className = (node === selectedNode ? "active" : "");
        div.textContent = node;
        div.onclick = () => {
          selectedNode = node;
          document.getElementById("currentNode").textContent = "Chat with " + node;
          document.getElementById("sendBox").style.display = "flex";
          renderChat();
          updateNodeList(); // refresh highlight
        };
        nodeList.appendChild(div);
      });
    }

    // Render chat bubbles
    function renderChat() {
      const chatDiv = document.getElementById("chat");
      chatDiv.innerHTML = "";

      if (!selectedNode) {
        chatDiv.innerHTML = '<div class="empty">No messages yet</div>';
        return;
      }

      const nodeMsgs = messages.filter(m => 
        m.sender === selectedNode || (m.sender === "Me" && m.target === selectedNode)
      );

      if (nodeMsgs.length === 0) {
        chatDiv.innerHTML = '<div class="empty">No messages yet</div>';
        return;
      }

      nodeMsgs.forEach(m => {
        const isOutgoing = (m.sender === "Me" && m.target === selectedNode);
        const bubble = document.createElement("div");
        bubble.className = "msg " + (isOutgoing ? "outgoing" : "incoming");
        bubble.innerHTML = `
          ${escapeHtml(m.text)} 
          ${m.gps ? `<br><a href="https://maps.google.com/?q=${encodeURIComponent(m.gps)}" target="_blank">${m.gps}</a>` : ""}
          <span class="meta">${escapeHtml(m.receivedAt)}</span>
        `;
        chatDiv.appendChild(bubble);
      });

      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // Send message
    async function sendMessage() {
      if (!selectedNode) return;
      const msg = document.getElementById("msg").value.trim();
      if (!msg) return;

      const msgID = Date.now().toString();
      const newMsg = {
        msgID,
        sender: "Me",
        target: selectedNode,
        type: "MSG",
        text: msg,
        gps: "",
        receivedAt: new Date().toLocaleString()
      };

      // Show it immediately
      messages.push(newMsg);
      renderChat();

      try {
        const url = `${baseURL}/send?target=${encodeURIComponent(selectedNode)}&msg=${encodeURIComponent(msg)}`;
        await fetch(url);
        document.getElementById("msg").value = "";
      } catch (e) {
        console.error("Send error", e);
      }
    }

    // Download logs
    function downloadLogs() {
      if (messages.length === 0) {
        alert("No messages to download");
        return;
      }

      const lines = messages.map(m => {
        const gps = m.gps ? m.gps : "";
        return `[${m.receivedAt}] ${m.sender} → ${m.target || ""} | ${m.text} | ${gps}`;
      });

      const blob = new Blob([lines.join("\n")], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "chat_logs.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    document.getElementById("downloadBtn").addEventListener("click", downloadLogs);

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Poll every 2s
    fetchMessages();
    setInterval(fetchMessages, 2000);
  </script>
</body>
</html>
